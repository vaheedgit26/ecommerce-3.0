apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    project: ecommerce
    tier: frontend
    component: frontend
data:
  nginx.conf: |
    user nginx;
	worker_processes auto;
	error_log /var/log/nginx/error.log notice;
	pid /run/nginx.pid;

	include /usr/share/nginx/modules/*.conf;

	events {
		worker_connections 1024;
	}

	http {
		log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

		access_log  /var/log/nginx/access.log  main;

		sendfile            on;
		tcp_nopush          on;
		keepalive_timeout   65;
		types_hash_max_size 4096;

		include             /etc/nginx/mime.types;
		default_type        application/octet-stream;

		include /etc/nginx/conf.d/*.conf;


		upstream product-service { server product-service:8001; }

		upstream cart-service { server cart-service:8002; }

		upstream user-service { server user-service:8003; }
        
		upstream order-service { server order-service:8004; }
        
    

		server {
			listen       8000;
			listen       [::]:8000;
			server_name  _;
			root         /usr/share/nginx/html;

			include /etc/nginx/default.d/*.conf;

			error_page 404 /404.html;
			location = /404.html {
			}

			error_page 500 502 503 504 /50x.html;
			location = /50x.html {
			}

			location /images/ {
				expires 5s;
				root   /usr/share/nginx/html;
				try_files $uri /images/placeholder.jpg;
			}

			# Health check
			location /health {
				return 200 "OK\n";
				add_header Content-Type text/plain;
			}

			# Product Service routes
			location /api/products {
				# Handle preflight requests
				if ($request_method = 'OPTIONS') {
					add_header 'Access-Control-Allow-Origin' '*';
					add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
					add_header 'Access-Control-Allow-Headers' '*';
					add_header 'Access-Control-Max-Age' 1728000;
					add_header 'Content-Type' 'text/plain; charset=utf-8';
					add_header 'Content-Length' 0;
					return 204;
				}
            
				proxy_pass http://product-service/products;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
            
				# Add CORS headers for actual requests
				add_header 'Access-Control-Allow-Origin' '*' always;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
				add_header 'Access-Control-Allow-Headers' '*' always;
			}

			# Cart Service routes
			location /api/cart {
				# Handle preflight requests
				if ($request_method = 'OPTIONS') {
					add_header 'Access-Control-Allow-Origin' '*';
					add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
					add_header 'Access-Control-Allow-Headers' '*';
					add_header 'Access-Control-Max-Age' 1728000;
					add_header 'Content-Type' 'text/plain; charset=utf-8';
					add_header 'Content-Length' 0;
					return 204;
				}
            
				proxy_pass http://cart-service/cart;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-User-Id $http_x_user_id;
            
				# Add CORS headers for actual requests
				add_header 'Access-Control-Allow-Origin' '*' always;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
				add_header 'Access-Control-Allow-Headers' '*' always;
			}

			# User Service routes
			location ~ ^/api/users(.*)$ {
				# Handle preflight requests
				if ($request_method = 'OPTIONS') {
					add_header 'Access-Control-Allow-Origin' '*';
					add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
					add_header 'Access-Control-Allow-Headers' '*';
					add_header 'Access-Control-Max-Age' 1728000;
					add_header 'Content-Type' 'text/plain; charset=utf-8';
					add_header 'Content-Length' 0;
					return 204;
				}
            
				proxy_pass http://user-service/users$1;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-User-Id $http_x_user_id;
            
				# Add CORS headers for actual requests
				add_header 'Access-Control-Allow-Origin' '*' always;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
				add_header 'Access-Control-Allow-Headers' '*' always;
			}

			# Order Service routes
			location ~ ^/api/orders(.*)$ {
				# Handle preflight requests
				if ($request_method = 'OPTIONS') {
					add_header 'Access-Control-Allow-Origin' '*';
					add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
					add_header 'Access-Control-Allow-Headers' '*';
					add_header 'Access-Control-Max-Age' 1728000;
					add_header 'Content-Type' 'text/plain; charset=utf-8';
					add_header 'Content-Length' 0;
					return 204;
				}
            
				proxy_pass http://order-service/orders$1;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-User-Id $http_x_user_id;
            
				# Add CORS headers for actual requests
				add_header 'Access-Control-Allow-Origin' '*' always;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
				add_header 'Access-Control-Allow-Headers' '*' always;
			}    

		}
	}
